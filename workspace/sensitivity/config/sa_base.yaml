suite: sensitivity
run_name: sa_base
description: Base scenario for Morris sensitivity screening
config_version: '1'
modules:
  - anthroDisturbance_DataPrep
  - potentialResourcesNT_DataPrep
  - anthroDisturbance_Generator
times:
  start: 2011
  end: 2031
  timeunit: year
paths:
  input_root: data/raw
  output_root: outputs
  scratch_root: scratch
  module_path: modules
data_profile: raw
params:
  anthroDisturbance_Generator:
    generatedDisturbanceAsRaster: no
    useClusterMethod: yes
    refinedStructure: yes
    maskWaterAndMountainsFromLines: yes
    verboseDiagnostics: no
    disturbFirstYear: no
    saveInitialDisturbances: no
    runClusteringInParallel: no
    growthStepGenerating: 0.01
    disturbanceRateRelatesToBufferedArea: yes
    use_wind_data: no
    seismicLineGrids: 500
    altitudeCut: 550
    clusterDistance: 1000
    distanceNewLinesFactor: 1.5
n_reps: 1
seed_base: 12345
input_behaviour:
  allow_download_if_missing: no

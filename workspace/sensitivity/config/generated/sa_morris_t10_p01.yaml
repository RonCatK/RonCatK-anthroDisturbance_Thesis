suite: sensitivity
run_name: sa_morris_t10_p01
description: Morris trajectory 10 point 1
config_version: '1'
modules:
- anthroDisturbance_DataPrep
- potentialResourcesNT_DataPrep
- anthroDisturbance_Generator
times:
  start: 2011
  end: 2031
  timeunit: year
paths:
  input_root: data/raw
  output_root: outputs
  scratch_root: scratch
  module_path: modules
data_profile: preprocessed
params:
  anthroDisturbance_Generator:
    generatedDisturbanceAsRaster: no
    useClusterMethod: yes
    refinedStructure: yes
    maskWaterAndMountainsFromLines: yes
    verboseDiagnostics: no
    disturbFirstYear: no
    saveInitialDisturbances: no
    runClusteringInParallel: no
    growthStepGenerating: 0.01
    disturbanceRateRelatesToBufferedArea: yes
    use_wind_data: no
    seismicLineGrids: 500
    altitudeCut: 550
    clusterDistance: 500.0
    distanceNewLinesFactor: 2.2
    totalDisturbanceRate: 2.0
    siteSelectionAsDistributing: oilGas;cutblocks
n_reps: 4
seed_base: 12565
input_behaviour:
  allow_download_if_missing: no
seeds:
- 12565
- 12566
- 12567
- 12568
